name: CI

on:
  push:
  pull_request:

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/forceformer-repro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: experiments/forceformer-repro/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run CPU smoke tests
        run: python -m unittest discover -s tests -v
